name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn opencv-python-headless numpy python-multipart pytest httpx
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run fast tests
        run: python -m pytest -v -m "not integration"

  integration-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn opencv-python-headless numpy python-multipart pytest httpx
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run integration tests
        run: python -m pytest -v -m "integration"
